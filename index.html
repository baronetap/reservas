
<!DOCTYPE html>
<html>
  <head>
    <title>Reserva Barone Tap</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8f8f8;
        padding: 20px;
      }
      form {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        max-width: 400px;
        margin: auto;
      }
      h2 {
        text-align: center;
      }
      label {
        margin-top: 10px;
        display: block;
      }
      input, select, button {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #ccc;
      }
      button {
        background-color: #25D366;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
    <script>
      function enviarReserva() {
        const nombre = document.getElementById("nombre").value;
        const fecha = document.getElementById("fecha").value;
        const hora = document.getElementById("hora").value;
        const personas = document.getElementById("personas").value;

        const mensaje = `¡Hola! Quiero hacer una reserva en Barone Tap:%0A
Nombre: ${nombre}%0A
Fecha: ${fecha}%0A
Hora: ${hora}%0A
Cantidad de personas: ${personas}`;

        const url = `https://wa.me/5492915220499?text=${mensaje}`;
        window.open(url, "_blank");
      }
    </script>
  </head>
  <body>
    <form onsubmit="event.preventDefault(); enviarReserva();">
      <h2>Reservá tu mesa en Barone Tap</h2>
      <label>Nombre y Apellido:</label>
      <input type="text" id="nombre" required />
      <label>Fecha:</label>
      <input type="date" id="fecha" required />
      <label>Hora:</label>
      <select id="hora" required>
        <option value="20:00">20:00</option>
        <option value="20:30">20:30</option>
        <option value="21:00">21:00</option>
        <option value="21:30">21:30</option>
        <option value="22:00">22:00</option>
        <option value="22:30">22:30</option>
        <option value="23:00">23:00</option>
        <option value="23:30">23:30</option>
      </select>
      <label>Cantidad de personas:</label>
<input type="text" id="personas" placeholder="Ej: 3 adultos y 1 niño" required />
      <button type="submit">Reservar por WhatsApp</button>
    </form>
  </body>
</html>
